<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ThreeJSON is a JSON-driven Three.js 3D scene runtime with visual tools, examples, runtime editing, and AI scene generation.">
  <title>ThreeJSON</title>
  <link rel="canonical" href="https://threejson.org/website/">
  <link rel="icon" href="../assets/img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="./css/site.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@0.184.0",
        "three/examples/jsm/": "https://esm.sh/three@0.184.0/examples/jsm/",
        "fflate": "https://esm.sh/fflate@0.8.3",
        "@tweenjs/tween.js": "https://esm.sh/@tweenjs/tween.js@25.0.0",
        "html2canvas-pro": "https://esm.sh/html2canvas-pro@2.0.4",
        "gifuct-js": "https://esm.sh/gifuct-js@2.1.2",
        "three-mesh-bvh": "https://esm.sh/three-mesh-bvh@0.9.10?deps=three@0.184.0",
        "three-bvh-csg": "https://esm.sh/three-bvh-csg@0.0.18?deps=three@0.184.0,three-mesh-bvh@0.9.10",
        "troika-three-text": "https://esm.sh/troika-three-text@0.52.4?deps=three@0.184.0"
      }
    }
  </script>
</head>
<body>
  <header class="siteHeader">
    <a class="brand" href="#/" aria-label="ThreeJSON">
      <img src="../assets/img/threejson.png" alt="ThreeJSON">
    </a>
    <button type="button" id="mainNavToggle" class="mainNavToggle" aria-label="菜单" aria-expanded="false" aria-controls="mainNav">
      <svg viewBox="0 0 20 16" aria-hidden="true" focusable="false"><rect y="0" width="20" height="2" rx="1" fill="currentColor"/><rect y="7" width="20" height="2" rx="1" fill="currentColor"/><rect y="14" width="20" height="2" rx="1" fill="currentColor"/></svg>
    </button>
    <nav class="mainNav" id="mainNav" aria-label="Main">
      <a href="#/" data-i18n="nav.home">首页</a>
      <div class="navMenu">
        <button type="button" data-i18n="nav.docs">文档</button>
        <div class="dropdown">
          <a href="#/docs-index" data-i18n="docs.index">索引</a>
          <a href="#" data-doc="features.md" data-i18n="docs.features">特性</a>
          <a href="#" data-doc="README.md" data-i18n="docs.manual">使用手册</a>
          <a href="#" data-doc="api.md" data-i18n="docs.api">API</a>
          <a href="#" data-doc="json-format.md" data-i18n="docs.jsonConfig">JSON 配置</a>
          <a href="#" data-doc="changelog.md" data-i18n="docs.changelog">版本记录</a>
          <a href="#" data-doc="faq.md" data-i18n="docs.faq">常见问题</a>
        </div>
      </div>
      <div class="navMenu">
        <button type="button" data-i18n="nav.download">下载</button>
        <div class="dropdown">
          <a href="#/download" data-i18n="download.download">下载 ThreeJSON</a>
          <a href="#" id="downloadSceneJsons" data-i18n="download.scenes">下载示例JSON</a>
        </div>
      </div>
      <div class="navMenu">
        <button type="button" data-i18n="nav.tools">工具</button>
        <div class="dropdown">
          <a href="#" id="openEditorTool" data-i18n="tools.editor">场景编辑器</a>
          <a href="#" id="openPlayerTool" data-i18n="tools.player">场景播放器</a>
          <a href="#" id="openShowerTool" data-i18n="tools.shower">场景展示器</a>
          <a href="#" id="openThreeBoxTool" data-i18n="tools.threebox">ThreeBox</a>
          <a href="#" data-doc="glossary.md" data-i18n="tools.glossary">术语手册</a>
          <a href="../examples/html-demo/demo.html" target="_blank" rel="noreferrer" data-i18n="tools.more">更多资源</a>
        </div>
      </div>
      <a href="#/examples" data-i18n="nav.examples">示例</a>
      <div class="navMenu">
        <button type="button" data-i18n="nav.community">社区</button>
        <div class="dropdown">
          <a href="#/contributors" data-i18n="community.contributors">贡献者列表</a>
          <a href="#" data-doc="mailing-list.md" data-i18n="community.mail">邮件列表</a>
          <a href="#" data-doc="contributing-guide.md" data-i18n="community.contribute">如何贡献</a>
          <a href="#/dependencies" data-i18n="community.dependencies">依赖项</a>
          <a href="#" data-doc="design-principles.md" data-i18n="community.codeStyle">代码规范</a>
          <a href="#/contact" data-i18n="community.contact">联系我们</a>
          <details class="dropdownSubmenu">
            <summary data-i18n="community.license">许可协议</summary>
            <div class="dropdownSubmenuPanel">
              <a href="#" id="communityLicenseLink" target="_blank" rel="noreferrer" data-i18n="community.licenseMit">MIT 许可证（LICENSE）</a>
              <a href="#" id="communityTrademarkLink" target="_blank" rel="noreferrer" data-i18n="community.licenseTrademark">商标声明（TRADEMARK）</a>
            </div>
          </details>
          <a href="https://github.com/nnrj/threejson" target="_blank" rel="noreferrer" data-i18n="community.source">源码（GitHub）</a>
          <a href="https://github.com/nnrj/threejson/issues" target="_blank" rel="noreferrer" data-i18n="community.issues">Issues（GitHub）</a>
        </div>
      </div>
    </nav>
    <button type="button" id="headerToolsToggle" class="headerToolsToggle" aria-label="更多" aria-expanded="false">
      <svg viewBox="0 0 4 16" aria-hidden="true" focusable="false"><circle cx="2" cy="2" r="1.8" fill="currentColor"/><circle cx="2" cy="8" r="1.8" fill="currentColor"/><circle cx="2" cy="14" r="1.8" fill="currentColor"/></svg>
    </button>
    <div class="headerTools" id="headerTools">
      <label class="selectTool">
        <span data-i18n="theme.label">主题</span>
        <select id="themeSelect">
          <option value="auto" data-i18n="theme.auto">自动</option>
          <option value="light" data-i18n="theme.light">浅色</option>
          <option value="dark" data-i18n="theme.dark">深色</option>
        </select>
      </label>
      <label class="selectTool">
        <span data-i18n="lang.label">语言</span>
        <select id="langSelect">
          <option value="auto" data-i18n="lang.auto">自动</option>
          <option value="zh-CN" data-i18n="lang.zh">简体中文</option>
          <option value="en-US" data-i18n="lang.en">English</option>
        </select>
      </label>
      <a class="iconLink" href="https://www.npmjs.com/package/threejson" target="_blank" rel="noreferrer" aria-label="npm">npm</a>
      <a class="iconLink" href="https://github.com/nnrj/threejson" target="_blank" rel="noreferrer" aria-label="GitHub">GH</a>
    </div>
  </header>
  <main id="app" class="siteMain"></main>
  <script type="module" src="./js/site.js"></script>
</body>
</html>
